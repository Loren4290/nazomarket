<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>謎解きマーケット 購入リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f9;--card:#ffffff;--ink:#4a3b52;--sub:#9a86a3;--line:#f6d9e6;--accent:#ff7eb6;--accent-d:#e85a9b;--accent2:#ffe9f3;--lav:#ece6ff;--lav-d:#8a6fe0;--warn:#ff9a5c;--mint:#d9f7ec;--mint-d:#2f9e78;--shadow:0 6px 18px rgba(255,126,182,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1822;--card:#2a2231;--ink:#fbeaf3;--sub:#b9a3c4;--line:#44344f;--accent:#ff8fc2;--accent-d:#ff8fc2;--accent2:#3b2a45;--lav:#34294f;--lav-d:#b9a3ff;--warn:#ffb084;--mint:#21382f;--mint-d:#7fe0b8;--shadow:0 6px 18px rgba(0,0,0,.35)}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:22px 22px;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;line-height:1.55;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#ff9ccb,#c3a6ff);color:#fff;border-radius:24px;padding:20px 18px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"🧩 ✨ 🔍";position:absolute;right:14px;top:10px;font-size:22px;opacity:.9;letter-spacing:4px}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.sub{font-size:13px;margin:0;opacity:.95}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card>.pn:first-child{font-size:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--lav-d);margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent2)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:99px;padding:10px 18px;cursor:pointer;background:linear-gradient(135deg,#ff8fc2,#ff6aa8);color:#fff;box-shadow:0 4px 10px rgba(255,106,168,.35);transition:transform .1s}
button:active{transform:scale(.95)}
button.ghost{background:var(--lav);color:var(--lav-d);box-shadow:none}
.bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.total{font-size:26px;font-weight:700;color:var(--accent-d)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:12px 0 8px}
.chip{white-space:nowrap;background:var(--lav);color:var(--lav-d);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--lav-d);color:#fff}
.item{border:2px dashed var(--line);border-radius:18px;padding:12px;margin-top:10px;background:var(--bg)}
.item.done{background:var(--mint);border-color:var(--mint-d)}
.item.done .pn{text-decoration:line-through;opacity:.55}
.item.done .price::before{content:"✅ "}
.pn{font-weight:700;font-size:16px}.meta{font-size:12px;color:var(--sub);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 9px;margin-right:4px}
.tag.booth{background:transparent;border:1.5px solid var(--warn);color:var(--warn)}
.top{display:flex;justify-content:space-between;gap:10px}.price{font-weight:700;color:var(--accent-d);white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:10px}.acts input{padding:6px 10px;font-size:14px;flex:1;min-width:0}.acts button{padding:6px 12px;font-size:13px}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.empty::before{content:"🔍";display:block;font-size:32px;margin-bottom:4px}
.msg{background:var(--accent2);border:2px solid var(--accent);border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px}
a.btn{display:inline-block;font-weight:700;font-size:14px;border-radius:99px;padding:9px 16px;background:var(--lav);color:var(--lav-d);text-decoration:none}
img.map{width:100%;height:auto;border-radius:16px;border:2px solid var(--line);margin-top:10px;display:block}
details{margin-top:14px;background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:10px 12px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--lav-d)}
.bhit{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>謎解きマーケット<br>おかいものリスト</h1>
  <p class="sub">団体名・商品名・ブースをみんなでチェック ✿</p></div>
  <div id="msg" class="msg" hidden></div>

  <div id="start" class="card" hidden>
    <div class="pn">はじめに</div>
    <p class="hint">新しいリストを作って、URLを友人に送ると全員で同じリストを編集できます。</p>
    <div class="bar"><button id="newList">🎀 新しいリストをつくる</button></div>
  </div>

  <div id="app" hidden>
    <div class="card">
      <label for="me">あなたの名前</label>
      <input id="me" placeholder="例：たろう ♡" maxlength="20">
      <div class="hint" id="exh"></div>
      <div class="row2">
        <div><label for="grp">団体名</label><input id="grp"></div>
        <div><label for="pn">商品名</label><input id="pn"></div>
      </div>
      <div class="row">
        <div><label for="pr">金額（円）</label><input id="pr" type="number" inputmode="numeric" min="0"></div>
        <div><label for="qt">個数</label><input id="qt" type="number" inputmode="numeric" min="1" value="1"></div>
        <div><label for="bt">ブース</label><input id="bt" placeholder="後で入力OK"></div>
      </div>
      <label for="url">公式ポストのURL（保存用）</label>
      <input id="url" type="url" inputmode="url" placeholder="https://x.com/...">
      <div class="bar"><button id="add">🛍 リストに追加</button><button id="share" class="ghost">🔗 URLをコピー</button></div>
    </div>

    <div class="card">
      <div class="sum"><div><div class="hint" style="margin:0" id="cnt"></div><div class="total" id="tot">¥0</div></div>
        <select id="sort" style="width:auto"><option value="t">追加順</option><option value="b">ブース順</option><option value="g">団体名順</option></select></div>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </div>
    <div class="card" id="mapCard">
      <div class="pn">🗺 会場マップ</div>
      <a href="https://www.scrapmagazine.com/s/nazomarket/img/top/map_2026.jpg" target="_blank" rel="noopener">
        <img class="map" src="https://www.scrapmagazine.com/s/nazomarket/img/top/map_2026.jpg" alt="会場内マップ" loading="lazy">
      </a>
      <div class="hint">タップで拡大できます。出典：ナゾトキマーケット公式サイト</div>
      <div class="bar"><a class="btn" href="https://www.scrapmagazine.com/s/nazomarket/booth/" target="_blank" rel="noopener">📋 公式ブース一覧を開く</a></div>

      <label for="bsearch">団体名からブースを探す</label>
      <input id="bsearch" placeholder="団体名を入力">
      <div id="bres"></div>

      <details>
        <summary>ブース一覧を取り込む（全員で共有）</summary>
        <p class="hint">公式のブース一覧から「ブース番号　団体名」をコピーして、1行ずつ貼り付けてください。</p>
        <textarea id="bimp" placeholder="例）&#10;A-12 ○○団体&#10;B-03 △△制作室"></textarea>
        <div class="bar"><button id="bsave">取り込む</button><button id="bfill" class="ghost">リストのブースを自動入力</button></div>
        <div class="hint" id="bst"></div>
      </details>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ▼▼ ここにFirebaseの設定値を貼り付けてください ▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyAoIIJTrou8NBAsvDJD4vjMiyAD0Jv-sW4",
  authDomain: "nazomarket2026.firebaseapp.com",
  projectId: "nazomarket2026",
  storageBucket: "nazomarket2026.firebasestorage.app",
  messagingSenderId: "917844582639",
  appId: "1:917844582639:web:064cf46fd054e5705efb1a"
};
/* ▲▲ ここまで ▲▲ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + (Number(n) || 0).toLocaleString("ja-JP");
const showMsg = t => { $("msg").textContent = t; $("msg").hidden = !t; };

if (firebaseConfig.apiKey.startsWith("YOUR_")) {
  showMsg("Firebaseの設定がまだです。index.html 上部の firebaseConfig に設定値を貼り付けてください。");
  throw new Error("firebaseConfig not set");
}
const db = getFirestore(initializeApp(firebaseConfig));

let listId = new URLSearchParams(location.search).get("r");
let items = [], filter = "all", boothList = [];

try { $("me").value = localStorage.getItem("me") || ""; } catch (e) {}
$("me").addEventListener("input", () => { try { localStorage.setItem("me", $("me").value); } catch (e) {} });

function newId() {
  const a = new Uint8Array(10); crypto.getRandomValues(a);
  return [...a].map(b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
}
$("newList").onclick = () => { location.search = "?r=" + newId(); };

if (!listId) { $("start").hidden = false; }
else {
  $("app").hidden = false;
  const col = collection(db, "lists", listId, "items");
  onSnapshot(col, s => { items = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    () => showMsg("データを読み込めませんでした。Firestoreの作成とルールの設定を確認してください。"));

  $("add").onclick = async () => {
    const who = $("me").value.trim();
    if (!$("pn").value.trim()) { $("exh").textContent = "商品名を入力してください。"; return; }
    if (!who) { $("exh").textContent = "あなたの名前を入力してください。"; return; }
    try {
      await addDoc(col, { who, group: $("grp").value.trim(), name: $("pn").value.trim(),
        price: Number($("pr").value) || 0, qty: Math.max(1, Number($("qt").value) || 1),
        booth: $("bt").value.trim(), url: $("url").value.trim(), done: false, t: Date.now() });
      ["grp","pn","pr","bt","url"].forEach(k => $(k).value = ""); $("qt").value = 1; $("exh").textContent = "追加しました ✓";
    } catch (e) { $("exh").textContent = "追加できませんでした。ルール設定を確認してください。"; }
  };
  const upd = (id, p) => updateDoc(doc(db, "lists", listId, "items", id), p).catch(() => showMsg("更新できませんでした。"));
  $("list").onclick = e => {
    const el = e.target.closest(".item"); if (!el) return;
    const id = el.dataset.id, it = items.find(i => i.id === id);
    if (e.target.closest(".sv")) upd(id, { booth: el.querySelector(".bi").value.trim() });
    else if (e.target.closest(".su")) upd(id, { url: el.querySelector(".ui").value.trim() });
    else if (e.target.closest(".dn")) upd(id, { done: !it.done });
    else if (e.target.closest(".rm") && confirm("削除しますか？")) deleteDoc(doc(db, "lists", listId, "items", id)).catch(() => showMsg("削除できませんでした。"));
  };
}

$("share").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("exh").textContent = "URLをコピーしました。友人に送ってください。"; }
  catch (e) { $("exh").textContent = location.href; }
};

function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
function render() {
  const names = [...new Set(items.map(i => i.who).filter(Boolean))];
  if (filter !== "all" && !names.includes(filter)) filter = "all";
  $("chips").innerHTML = ["all", ...names].map(n => `<span class="chip ${n === filter ? "on" : ""}" data-n="${esc(n)}">${n === "all" ? "みんな" : esc(n)}</span>`).join("");
  let v = items.filter(i => filter === "all" || i.who === filter);
  const s = $("sort").value;
  v.sort((a, b) => s === "b" ? String(a.booth || "~").localeCompare(String(b.booth || "~"), "ja", { numeric: true })
    : s === "g" ? String(a.group).localeCompare(String(b.group), "ja") : (a.t || 0) - (b.t || 0));
  const open = v.filter(i => !i.done);
  $("tot").textContent = yen(open.reduce((a, i) => a + i.price * i.qty, 0));
  $("cnt").textContent = `未購入の合計（${open.length}/${v.length}件）`;
  $("list").innerHTML = v.length ? v.map(i => `<div class="item ${i.done ? "done" : ""}" data-id="${i.id}">
    <div class="top"><div><div class="pn">${esc(i.name)}</div>
    <div class="meta"><span class="tag">${esc(i.who)}</span>${esc(i.group) || "団体名なし"}　×${i.qty}</div>
    ${safeUrl(i.url) ? `<div class="meta"><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener" style="color:var(--lav-d);font-weight:700">🔗 公式ポストを開く</a></div>` : ""}
    <div class="meta"><span class="tag booth">${i.booth ? "📍 " + esc(i.booth) : (findBooth(i.group) ? "候補 📍 " + esc(findBooth(i.group)) : "ブース未定")}</span></div></div>
    <div class="price">${yen(i.price * i.qty)}</div></div>
    <div class="acts"><input class="bi" placeholder="ブース場所" value="${esc(i.booth)}"><button class="ghost sv">保存</button>
    <button class="ghost dn">${i.done ? "戻す" : "購入済"}</button><button class="ghost rm">🗑</button></div>
    <div class="acts"><input class="ui" type="url" placeholder="公式ポストのURL" value="${esc(i.url)}"><button class="ghost su">URL保存</button></div></div>`).join("") : `<div class="empty">まだ何もありません</div>`;
}
$("chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { filter = c.dataset.n; render(); } };
$("sort").onchange = render;

/* ---- ブース一覧（団体名→ブース） ---- */
const nz = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s・\-ー_【】「」『』()\[\]!?@.,。、]/g, "");
const BRE = "[A-Za-z]{0,2}[-ー－‐]?\\d{1,3}(?:[-ー－‐]\\d{1,3})?";
function parseBooths(text) {
  const out = [], only = new RegExp("^" + BRE + "$"), head = new RegExp("^(" + BRE + ")[\\s:：]+(.+)$"), tail = new RegExp("^(.+?)[\\s:：]+(" + BRE + ")$");
  for (let line of text.split(/\n/)) {
    line = line.normalize("NFKC").trim(); if (!line) continue;
    let booth = "", name = "";
    const parts = line.split(/\t|,|，/).map(x => x.trim()).filter(Boolean);
    if (parts.length >= 2) { const bi = parts.findIndex(x => only.test(x)); if (bi >= 0) { booth = parts[bi]; name = parts.filter((_, k) => k !== bi).join(" "); } }
    if (!booth) { let m = line.match(head); if (m) { booth = m[1]; name = m[2]; } else { m = line.match(tail); if (m) { name = m[1]; booth = m[2]; } } }
    if (booth && name) out.push({ name: name.trim(), booth });
  }
  return out;
}
function findBooth(g) {
  const k = nz(g); if (k.length < 2) return "";
  const hit = boothList.find(b => nz(b.name) === k) || boothList.find(b => { const n = nz(b.name); return n.length >= 2 && (n.includes(k) || k.includes(n)); });
  return hit ? hit.booth : "";
}
function autoBooth() {
  const b = findBooth($("grp").value);
  if (b && !$("bt").value) { $("bt").value = b; $("exh").textContent = "ブース " + b + " を自動入力しました。"; }
}
$("grp").addEventListener("change", autoBooth);

if (listId) {
  const bref = doc(db, "lists", listId, "booths", "map");
  try { boothList = JSON.parse(localStorage.getItem("booths:" + listId) || "[]"); } catch (e) {}
  onSnapshot(bref, s => {
    if (s.exists()) { try { boothList = JSON.parse(s.data().json || "[]"); localStorage.setItem("booths:" + listId, s.data().json); } catch (e) {} }
    render(); searchBooth();
  }, () => {});

  function searchBooth() {
    const k = nz($("bsearch").value);
    if (!k) { $("bres").innerHTML = boothList.length ? `<div class="hint">${boothList.length}団体のブース情報があります。</div>` : `<div class="hint">ブース一覧が未登録です。下の「取り込む」から登録してください。</div>`; return; }
    const hits = boothList.filter(b => nz(b.name).includes(k)).slice(0, 8);
    $("bres").innerHTML = hits.length ? hits.map(b => `<div class="bhit"><span>${esc(b.name)}</span><b>📍 ${esc(b.booth)}</b></div>`).join("") : `<div class="hint">見つかりませんでした。</div>`;
  }
  $("bsearch").addEventListener("input", searchBooth);

  $("bsave").onclick = async () => {
    const add = parseBooths($("bimp").value);
    if (!add.length) { $("bst").textContent = "読み取れませんでした。「ブース番号 団体名」を1行ずつ貼ってください。"; return; }
    const m = new Map(boothList.map(b => [nz(b.name), b])); add.forEach(b => m.set(nz(b.name), b));
    boothList = [...m.values()];
    const json = JSON.stringify(boothList);
    try { localStorage.setItem("booths:" + listId, json); } catch (e) {}
    try { await setDoc(bref, { json, t: Date.now() }); $("bst").textContent = add.length + "件を取り込みました（共有済み）。"; }
    catch (e) { $("bst").textContent = add.length + "件を取り込みました（この端末のみ。Firestoreのルールを更新すると共有できます）。"; }
    $("bimp").value = ""; render(); searchBooth();
  };
  $("bfill").onclick = async () => {
    let n = 0;
    for (const i of items) { if (!i.booth) { const b = findBooth(i.group); if (b) { await updateDoc(doc(db, "lists", listId, "items", i.id), { booth: b }).catch(() => {}); n++; } } }
    $("bst").textContent = n ? n + "件のブースを入力しました。" : "当てはまる団体が見つかりませんでした。";
  };
  searchBooth();
}

render();
</script>
</body>
</html>
